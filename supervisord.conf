# Hermes Kanban Web process supervision (runs as the hermes user via
# /app/start.sh -> supervisord). Replaces the base image's single-process
# uvicorn exec with: nginx (public proxy on $PORT), uvicorn (app on
# 127.0.0.1:12700), hermes gateway (embedded kanban dispatcher) and ttyd
# (web terminal on 127.0.0.1:7681, behind nginx at /kanban-terminal/).
#
# All pid/log/socket paths are under /tmp — supervisord and its children
# run as the non-root hermes user.

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
startretries=5
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:uvicorn]
command=python3 -m uvicorn main:app --host 127.0.0.1 --port 12700
directory=/app
user=hermes
environment=HOME="/opt/data",HERMES_HOME="/opt/data"
autorestart=true
startretries=10
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway]
# Embedded kanban dispatcher — claims 'ready' tasks and runs them on the
# assigned profile. Log lands under HERMES_HOME so it survives restarts.
command=/opt/hermes/bin/hermes gateway run
directory=/opt/data
user=hermes
environment=HOME="/opt/data",HERMES_HOME="/opt/data",PATH="/opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autorestart=true
startretries=10
stopwaitsecs=10
stdout_logfile=/opt/data/kanban/gateway.log
stdout_logfile_maxbytes=0
stderr_logfile=/opt/data/kanban/gateway.log
stderr_logfile_maxbytes=0

[program:ttyd]
# Web terminal on loopback; nginx exposes it at /kanban-terminal/ (ttyd token auth).
command=/usr/local/bin/start-ttyd.sh
directory=/app
user=hermes
environment=HOME="/opt/data",HERMES_HOME="/opt/data",TERM="xterm-256color",PATH="/opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autorestart=true
startretries=10
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
