<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15171A"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="120" fill="url(#bg)"/>
  <!-- Kanban board mark (white only): board outline + header + three columns with cards -->
  <rect x="150" y="180" width="500" height="440" rx="40" fill="none" stroke="#FFFFFF" stroke-width="26"/>
  <rect x="150" y="180" width="500" height="100" rx="40" fill="#FFFFFF"/>
  <!-- column dividers on header line -->
  <line x1="340" y1="180" x2="340" y2="280" stroke="#15171A" stroke-width="16"/>
  <line x1="466" y1="180" x2="466" y2="280" stroke="#15171A" stroke-width="16"/>
  <!-- three columns -->
  <rect x="200" y="330" width="116" height="230" rx="16" fill="none" stroke="#FFFFFF" stroke-width="22"/>
  <rect x="342" y="330" width="116" height="230" rx="16" fill="none" stroke="#FFFFFF" stroke-width="22"/>
  <rect x="484" y="330" width="116" height="230" rx="16" fill="none" stroke="#FFFFFF" stroke-width="22"/>
  <!-- cards inside columns -->
  <rect x="222" y="360" width="72" height="26" rx="13" fill="#15171A"/>
  <rect x="222" y="404" width="72" height="13" rx="13" fill="#334155"/>
  <rect x="364" y="360" width="72" height="26" rx="13" fill="#334155"/>
  <circle cx="400" cy="452" r="20" fill="#15171A"/>
  <rect x="506" y="360" width="72" height="13" rx="13" fill="#334155"/>
  <rect x="506" y="392" width="72" height="26" rx="13" fill="#334155"/>
</svg>