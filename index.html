<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<title>Hermes Kanban Web</title>
<link rel="stylesheet" href="/assets/css/styles.css">
<script>try{var t=localStorage.getItem('kanban-theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}</script>
</head>
<body>

<div class="header">
    <div class="board-selector">
        <h1>Hermes Kanban Web</h1>
        <div class="dropdown-wrapper">
            <button onclick="App.toggleBoardDropdown()" id="boardDropdownBtn" class="dropdown-btn">
                <span id="currentBoardLabel">Loading...</span>
                <span class="arrow">&#9660;</span>
            </button>
            <div id="boardDropdownMenu" class="dropdown-menu"></div>
        </div>
        <div class="dropdown-wrapper">
            <button onclick="App.toggleProfileDropdown()" id="profileDropdownBtn" class="dropdown-btn">
                <span id="currentProfileLabel">Loading...</span>
                <span class="arrow">&#9660;</span>
            </button>
            <div id="profileDropdownMenu" class="dropdown-menu"></div>
        </div>
    </div>
    <div class="stats" id="stats"></div>
</div>

<div class="main-container">
    <div class="board" id="kanbanBoard"></div>
    <div class="sidebar" id="detailPanel">
        <div class="empty-state">Select a task to view details</div>
    </div>
</div>

<!-- Task Modal -->
<div class="modal-overlay" id="taskModal">
    <div class="modal">
        <h2><span class="modal-icon">&#9998;</span><span id="taskModalTitle">Edit Task</span></h2>
        <div class="modal-body-full">
            <input type="hidden" id="taskId">
            <div class="field"><label>Title *</label><input id="taskTitle" placeholder="Task title..."></div>
            <div class="field"><label>Description</label><textarea id="taskDesc" placeholder="Description (markdown supported)..."></textarea></div>
            <div class="field"><label>Status</label>
                <select id="taskStatus">
                    <option value="backlog">Backlog</option>
                    <option value="todo">To Do</option>
                    <option value="inprogress">In Progress</option>
                    <option value="done">Done</option>
                    <option value="blocked">Blocked</option>
                </select>
            </div>
            <div class="field"><label>Board</label>
                <select id="taskBoard"></select>
            </div>
            <div class="field"><label>Promoted To Hermes Agent</label>
                <input type="checkbox" id="taskPromote">
                <span class="help-text">When checked, this task will be promoted to the corresponding agent status.</span>
            </div>
        </div>
        <div id="taskActions" class="modal-actions"></div>
    </div>
</div>

<!-- Detail Modal (moved outside main) -->
<div class="modal-overlay" id="detailModal">
    <div class="modal">
        <h2><span class="modal-icon">&#128196;</span><span>Edit Task</span></h2>
        <div class="modal-body-full" id="detailContent"></div>
        <div id="detailActions" class="modal-actions"></div>
    </div>
</div>

<!-- Create Board Modal -->
<div class="modal-overlay" id="createBoardModal">
    <div class="modal">
        <h2>Add New Board</h2>
        <div class="field"><label>Board Name *</label><input type="text" id="newBoardName" placeholder="e.g., Releases"></div>
        <div class="field"><label>Slug (auto-lowered)</label><input type="text" id="newBoardSlug" readonly></div>
    </div>
</div>

<!-- Delete Board Modal -->
<div class="modal-overlay" id="deleteBoardModal">
    <div class="modal">
        <h2>Delete Board</h2>
        <p id="deleteBoardMsg"></p>
        <button onclick="confirmDeleteBoard(false)" style="background:#6c757d;">Cancel</button>
        <button onclick="submitDeleteBoard()" style="background:#dc3545;">Delete</button>
    </div>
    <script src="/assets/js/boards.js?v=10"></script>
</div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="confirmModal">
    <div class="modal">
        <h2><span id="confirmTitle"></span></h2>
        <p id="confirmMessage"></p>
        <button onclick="closeConfirmModal(false)">Cancel</button>
        <button onclick="closeConfirmModal(true)" id="confirmOkBtn">OK</button>
    </div>
</div>

<!-- Setup Wizard Modal -->
<div class="modal-overlay" id="setupWizard">
    <div class="modal setup-modal">
        <h2><span class="modal-icon">&#9881;</span><span>Configure LLM</span></h2>
        <button class="close-btn" onclick="App.closeSetupWizard()">&times;</button>
        <div class="modal-body" id="setupWizardContent"></div>
    </div>
</div>

<!-- Toast Notification -->
<div class="toast" id="toast"></div>

<script src="/assets/js/utils.js?v=10"></script>
<script src="/assets/js/api.js?v=10"></script>
<script src="/assets/js/theme.js?v=10"></script>
<script src="/assets/js/boards.js?v=10"></script>
<script src="/assets/js/profiles.js?v=10"></script>
<script src="/assets/js/tasks.js?v=10"></script>
<script src="/assets/js/detail.js?v=10"></script>
<script src="/assets/js/dragdrop.js?v=10"></script>
<script src="/assets/js/websocket.js?v=10"></script>
<script src="/assets/js/setup-wizard.js?v=10"></script>
<script src="/assets/js/app.js?v=10"></script>

<!-- Hermes Agent Integration -->
<iframe id="canvasFrame" style="display:none;" height="0" width="0"></iframe>

</body>
</html>
